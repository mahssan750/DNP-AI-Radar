services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dnp_ai_radar"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        DEPLOYMENT_MODE: local
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
      args:
        DEPLOYMENT_MODE: local
    env_file:
      - .env
    stop_grace_period: 35s
    depends_on:
      db-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
